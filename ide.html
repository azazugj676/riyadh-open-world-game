<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>محرر الكود الذكي — riyadh-open-world-game</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--accent2:#a371f7;
  --ok:#3fb950;--err:#f85149;--user:#1f6feb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{margin:0;font-size:1rem;font-weight:600}
header h1 .repo{color:var(--accent)}
.commit-info{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.commit-info .msg{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.82rem;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--user);border-color:var(--user);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
main{flex:1;display:grid;grid-template-columns:230px 1fr 360px;min-height:0}
/* Sidebar */
aside.files{background:var(--panel);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
aside.files .ph{padding:10px 14px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#fileList{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
#fileList li{padding:7px 10px;border-radius:7px;font-size:.83rem;cursor:pointer;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
#fileList li:hover{background:var(--panel2)}
#fileList li.active{background:rgba(88,166,255,.15);color:var(--accent)}
#fileList li .ic{color:var(--muted);margin-inline-end:6px}
/* Editor */
section.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.editor-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.editor-bar .fname{font-size:.83rem;color:var(--accent);direction:ltr;font-family:monospace}
.editor-bar .actions{display:flex;gap:8px}
.code-wrap{flex:1;display:flex;min-height:0;direction:ltr}
.gutter{background:#0a0e14;color:#484f58;text-align:right;padding:14px 10px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;line-height:1.55;user-select:none;overflow:hidden;border-right:1px solid var(--border);min-width:48px}
#codeView{flex:1;background:#0a0e14;color:var(--text);border:0;outline:none;resize:none;padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;line-height:1.55;white-space:pre;overflow:auto}
/* Chat */
section.chat{background:var(--panel);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.chat-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.chat-head h2{margin:0;font-size:.9rem}
#chatStatus{font-size:.75rem;color:var(--muted)}
#messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;font-size:.86rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-start;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-end;background:var(--panel2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.err{align-self:flex-end;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);color:#ffa198}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--panel)}
#chatInput{flex:1;resize:none;min-height:44px;max-height:130px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;outline:none}
#chatInput:focus{border-color:var(--accent)}
.statusbar{padding:6px 14px;font-size:.72rem;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
.spin{width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;display:inline-block;vertical-align:-2px;margin-inline-end:5px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:1000px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr;overflow:auto}
  aside.files{max-height:180px;border-inline-end:0;border-bottom:1px solid var(--border)}
  section.chat{border-inline-start:0;border-top:1px solid var(--border);min-height:320px}
  body{overflow:auto}
}
</style>
</head>
<body>
<header>
  <h1>محرر الكود الذكي — <span class="repo">riyadh-open-world-game</span></h1>
  <div class="commit-info">
    <span id="commitMsg" class="msg">…</span>
    <span id="commitTime"></span>
    <button class="btn" id="refreshBtn" title="تحديث الملفات">⟳ تحديث</button>
  </div>
</header>
<main>
  <aside class="files">
    <div class="ph"><span>الملفات</span><span id="fileCount"></span></div>
    <ul id="fileList"></ul>
  </aside>
  <section class="editor">
    <div class="editor-bar">
      <span class="fname" id="curFile">اختر ملفًا</span>
      <div class="actions">
        <button class="btn" id="copyBtn">نسخ</button>
      </div>
    </div>
    <div class="code-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="codeView" readonly spellcheck="false" placeholder="اختر ملفًا من القائمة لعرضه هنا"></textarea>
    </div>
  </section>
  <section class="chat">
    <div class="chat-head"><h2>المحادثة مع AI</h2><span id="chatStatus">جاهز</span></div>
    <div id="messages"></div>
    <div class="composer">
      <textarea id="chatInput" placeholder="اطلب تعديلًا، مثال: غيّر لون الثعبان إلى أحمر"></textarea>
      <button class="btn primary" id="sendBtn">إرسال</button>
    </div>
  </section>
</main>
<div class="statusbar"><span id="statusLeft">GitHub ←→ n8n ←→ OpenRouter</span><span id="statusRight"></span></div>

<script>
const OWNER='azazugj676',REPO='riyadh-open-world-game',BRANCH='main';
const TREE_URL=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
const COMMITS_URL=`https://api.github.com/repos/${OWNER}/${REPO}/commits?per_page=1`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const CHAT_URL='https://ttghhnjyr66.app.n8n.cloud/webhook/07f78068-5628-43c2-b902-d5e5afd305b0/chat';
const SK='ide_session_id';
let sessionId=localStorage.getItem(SK);
if(!sessionId){sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem(SK,sessionId);}
const $=id=>document.getElementById(id);
let activePath='';

function setStatus(t){$('statusRight').textContent=t}
function addMsg(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}
function addTyping(){const d=document.createElement('div');d.className='msg ai';d.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}

async function gh(url){const r=await fetch(url);if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('GitHub '+r.status+': '+t.slice(0,200))}return r}

async function loadCommits(){
  try{
    const r=await gh(COMMITS_URL);const arr=await r.json();
    if(arr&&arr[0]){const c=arr[0];$('commitMsg').textContent=c.commit.message.split('\n')[0];
      const d=new Date(c.commit.committer.date);$('commitTime').textContent='· '+d.toLocaleString('ar');}
  }catch(e){$('commitMsg').textContent='تعذر جلب آخر commit'}
}

async function loadTree(){
  $('fileList').innerHTML='';$('fileCount').innerHTML='<span class="spin"></span>';
  try{
    const r=await gh(TREE_URL);const data=await r.json();
    const files=(data.tree||[]).filter(i=>i.type==='blob'&&i.path).map(i=>i.path).sort();
    $('fileCount').textContent=files.length;
    files.forEach(p=>{
      const li=document.createElement('li');
      const nm=p.split('/').pop();
      li.innerHTML='<span class="ic">📄</span>'+p;
      li.title=p;if(p===activePath)li.classList.add('active');
      li.onclick=()=>loadFile(p);
      $('fileList').appendChild(li);
    });
  }catch(e){$('fileCount').textContent='';addMsg('خطأ في جلب الملفات: '+e.message,'err')}
}

async function loadFile(path,silent){
  activePath=path;
  document.querySelectorAll('#fileList li').forEach(li=>li.classList.toggle('active',li.title===path));
  $('curFile').textContent=path;
  if(!silent){$('codeView').value='جارٍ التحميل…';}
  try{
    const r=await gh(RAW+encodeURI(path));const t=await r.text();
    $('codeView').value=t;
    const lines=t.split('\n').length;
    $('gutter').textContent=Array.from({length:lines},(_,i)=>i+1).join('\n');
    setStatus(lines+' سطر');
  }catch(e){if(!silent){$('codeView').value='تعذر تحميل الملف: '+e.message}}
}

$('codeView').addEventListener('scroll',()=>{$('gutter').scrollTop=$('codeView').scrollTop});
$('copyBtn').onclick=()=>{navigator.clipboard.writeText($('codeView').value||'').then(()=>setStatus('تم النسخ'))};
$('refreshBtn').onclick=()=>refreshAll();

async function refreshAll(){await Promise.all([loadTree(),loadCommits()]);if(activePath)await loadFile(activePath,true)}

async function send(){
  const text=$('chatInput').value.trim();if(!text)return;
  $('chatInput').value='';addMsg(text,'user');
  const typing=addTyping();$('sendBtn').disabled=true;$('chatStatus').textContent='يكتب…';
  try{
    const r=await fetch(CHAT_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'sendMessage',sessionId,chatInput:text})});
    const raw=await r.text();
    typing.remove();
    let out='',err='';
    raw.split(/\n+/).forEach(line=>{
      line=line.trim();if(!line)return;
      if(line.startsWith('data:'))line=line.slice(5).trim();
      try{const j=JSON.parse(line);
        if(j.type==='item'&&typeof j.content==='string')out+=j.content;
        else if(j.type==='error')err+=(j.content||'خطأ غير معروف');
      }catch(_){}
    });
    if(err){addMsg('خطأ: '+err,'err');$('chatStatus').textContent='خطأ';}
    else if(out){addMsg(out,'ai');$('chatStatus').textContent='تم';
      // بعد نجاح الرد، حدّث الملفات والـ commit والملف المفتوح
      await refreshAll();
    }
    else{addMsg('تعذر فك رد الخادم. الرد الخام:\n'+raw.slice(0,400),'err');$('chatStatus').textContent='خطأ';}
  }catch(e){typing.remove();addMsg('فشل الاتصال بالمساعد: '+e.message,'err');$('chatStatus').textContent='خطأ';}
  finally{$('sendBtn').disabled=false}
}

$('sendBtn').onclick=send;
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

addMsg('مرحبًا! أنا مساعدك لتعديل مشروعك على GitHub. اختر ملفًا لعرضه، واكتب أمر التعديل هنا. بعد نجاح التعديل سيُحدَّث الكود تلقائيًا.','ai');
refreshAll();
</script>
</body>
</html>
